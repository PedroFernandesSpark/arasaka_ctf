services:
  db:
    image: postgres:16
    container_name: arquivo-fantasma-db
    environment:
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ctf
      POSTGRES_DB: nacar_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d nacar_archive"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    container_name: arquivo-fantasma-app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ctf
      DB_PASSWORD: ctf
      DB_NAME: nacar_archive
      PIN_CODE: ${PIN_CODE:-518274}
      FLAG_IDOR: ${FLAG_IDOR:-FLAG{private_dispatch_n09}}
      FLAG_ADMIN: ${FLAG_ADMIN:-FLAG{arasaka_directorate_access}}
      SSH_PORT: 2222
      SSH_USERNAME: operator
      SSH_PASSWORD: ${SSH_PASSWORD:-ArasakaArchive09}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  ssh:
    build: ./ssh
    container_name: arquivo-fantasma-ssh
    environment:
      SSH_PASSWORD: ${SSH_PASSWORD:-ArasakaArchive09}
      FLAG_SSH: ${FLAG_SSH:-FLAG{cunningham_signal_recovered}}
      FLAG_ROOT: ${FLAG_ROOT:-FLAG{black_wall_root_backup}}
    ports:
      - "2222:22"
